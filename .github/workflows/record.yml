name: record

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_TOUR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund

      - name: Prebuild iOS project (no pods)
        run: CI=1 npx expo prebuild --platform ios --clean --no-install

      - name: Adopt UIScene lifecycle
        run: bash scripts/scene-patch.sh

      - name: Pin Pods deployment target
        run: |
          ruby scripts/pin-pods.rb
          cd ios && pod install

      - name: Pick a 6.9in simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Pro Max' | head -1)
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Plus' | head -1); fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "using: $NAME"

      - name: Build release app for simulator
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.4 > "$RUNNER_TEMP/build.log" 2>&1
          RC=$?
          echo "xcodebuild rc=$RC"
          grep -n "error:" "$RUNNER_TEMP/build.log" | head -30 || true
          tail -15 "$RUNNER_TEMP/build.log" || true
          [ $RC -eq 0 ] || exit $RC
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" -print | head -1)
          echo "APP=$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -l "$APP" | head -20
          ls -l "$APP/main.jsbundle" || true

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b || true
          xcrun simctl status_bar "${{ steps.sim.outputs.name }}" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Install app
        run: |
          DEV="${{ steps.sim.outputs.name }}"
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl get_app_container "$DEV" com.lixing.sitemath app || true

      - name: Record launch and tour
        run: |
          set -x
          DEV="${{ steps.sim.outputs.name }}"
          OUT="$RUNNER_TEMP/rec"
          mkdir -p "$OUT"
          xcrun simctl terminate "$DEV" com.lixing.sitemath || true
          xcrun simctl io "$DEV" recordVideo --codec h264 --force "$OUT/sitemath-review.mp4" &
          RPID=$!
          sleep 2
          xcrun simctl launch --console-pty "$DEV" com.lixing.sitemath > "$OUT/console.log" 2>&1 &
          CPID=$!
          sleep 5
          xcrun simctl io "$DEV" screenshot "$OUT/t05.png"
          sleep 4
          xcrun simctl io "$DEV" screenshot "$OUT/t09.png"
          sleep 12
          xcrun simctl io "$DEV" screenshot "$OUT/t21.png"
          sleep 12
          xcrun simctl io "$DEV" screenshot "$OUT/t33.png"
          sleep 8
          xcrun simctl io "$DEV" screenshot "$OUT/t41.png"
          kill "$CPID" 2>/dev/null || true
          kill -INT $RPID || true
          wait $RPID || true
          sleep 2
          ls -l "$OUT"
          echo "--- console ---"
          tail -80 "$OUT/console.log" || true
          echo "--- crash reports ---"
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -8 || true
          CR=$(ls -t ~/Library/Logs/DiagnosticReports/*SiteMath* 2>/dev/null | head -1 || true)
          if [ -n "$CR" ]; then cp "$CR" "$OUT/$(basename "$CR")"; sed -n '1,70p' "$CR"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitemath-review-recording
          path: |
            ${{ runner.temp }}/rec/*.mp4
            ${{ runner.temp }}/rec/*.png
            ${{ runner.temp }}/rec/*.log
            ${{ runner.temp }}/rec/*.ips
          if-no-files-found: warn
          retention-days: 14
