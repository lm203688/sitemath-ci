name: record

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_TOUR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci --legacy-peer-deps || npm install --no-audit --no-fund

      - name: Prebuild iOS project (no pods)
        run: CI=1 npx expo prebuild --platform ios --clean --no-install

      - name: Pin Pods deployment target
        run: |
          ruby scripts/pin-pods.rb
          cd ios && pod install

      - name: Pick a 6.9in simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Pro Max' | head -1)
          if [ -z "$NAME" ]; then NAME=$(xcrun simctl list devices available | grep -o 'iPhone 1[6-9] Plus' | head -1); fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "using: $NAME"

      - name: Build release app for simulator
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          set +e
          xcodebuild build \
            -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.4 > "$RUNNER_TEMP/build.log" 2>&1
          RC=$?
          echo "xcodebuild rc=$RC"
          grep -n "error:" "$RUNNER_TEMP/build.log" | head -30 || true
          tail -15 "$RUNNER_TEMP/build.log" || true
          [ $RC -eq 0 ] || exit $RC
          find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" -print

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b || true
          xcrun simctl status_bar "${{ steps.sim.outputs.name }}" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Install app and Maestro
        run: |
          DEV="${{ steps.sim.outputs.name }}"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app")
          echo "APP=$APP"
          xcrun simctl install "$DEV" "$APP"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Record launch and tour
        run: |
          set -x
          DEV="${{ steps.sim.outputs.name }}"
          OUT="$RUNNER_TEMP/rec"
          mkdir -p "$OUT"
          echo "--- bundle ---"
          ls -l "$APP" | head -30
          echo "--- console launch ---"
          timeout 25 xcrun simctl launch --console-pty "$DEV" com.lixing.sitemath 2>&1 | tail -80 || true
          xcrun simctl terminate "$DEV" com.lixing.sitemath || true
          echo "--- crash reports ---"
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -6 || true
          CR=$(ls -t ~/Library/Logs/DiagnosticReports/*SiteMath* 2>/dev/null | head -1 || true)
          if [ -n "$CR" ]; then sed -n '1,90p' "$CR"; fi          xcrun simctl terminate "$DEV" com.lixing.sitemath || true
          xcrun simctl io "$DEV" recordVideo --codec h264 --force "$OUT/sitemath-review.mp4" &
          RPID=$!
          sleep 2
          xcrun simctl launch "$DEV" com.lixing.sitemath || echo "LAUNCH FAILED"
          sleep 6
          xcrun simctl io "$DEV" screenshot "$OUT/t06.png"
          sleep 28
          xcrun simctl io "$DEV" screenshot "$OUT/t34.png"
          sleep 10
          xcrun simctl io "$DEV" screenshot "$OUT/t44.png"
          kill -INT $RPID || true
          wait $RPID || true
          sleep 2
          ls -l "$OUT"
          xcrun simctl spawn "$DEV" log show --last 3m --predicate 'processImagePath CONTAINS "SiteMath"' --style compact 2>/dev/null | tail -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitemath-review-recording
          path: |
            ${{ runner.temp }}/rec/*.mp4
            ${{ runner.temp }}/rec/**/*.png
          if-no-files-found: warn
          retention-days: 14






